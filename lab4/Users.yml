- name: Skapa devops_admin användare
  hosts: all
  become: true

  tasks:
    - name: Skapa devops_admin
      ansible.builtin.user:
        name: devops_admin
        state: present
        create_home: true
        groups: sudo
        append: true

    - name: Lägg till SSH-nyckel för devops_admin
      ansible.posix.authorized_key:
        user: devops_admin
        state: present
        key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/devops_admin.pub') }}"